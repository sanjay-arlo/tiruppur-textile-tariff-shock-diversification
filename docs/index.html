<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industry Business Analytics Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#f4f7fb;color:#182234;font:14px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1280px;margin:auto;padding:26px}.ey{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#1f4ed8}.hdr{display:flex;justify-content:space-between;gap:16px;align-items:end}h1{font-size:34px;margin:8px 0}.sub{color:#697586;line-height:1.5}.note{background:#eef4ff;border:1px solid #d8e5ff;padding:12px 14px;border-radius:12px;margin:14px 0}.actions{display:flex;gap:8px}button,select{padding:10px 12px;border:1px solid #ccd4df;background:#fff;border-radius:9px;font:inherit}.filters,.kpis{display:grid;gap:12px}.filters{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));background:#fff;border:1px solid #e3e8f0;padding:14px;border-radius:14px}label{display:flex;flex-direction:column;gap:7px;color:#697586;font-size:12px}.kpis{grid-template-columns:repeat(4,1fr);margin:14px 0}.kpi,.card{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:16px}.kpi span{font-size:12px;color:#697586}.kpi strong{display:block;font-size:27px;margin-top:8px}.grid3{display:grid;grid-template-columns:1.2fr 1fr .75fr;gap:12px;margin-top:14px}.chart{height:310px}.wide{margin-top:14px}#scenario{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input[type=range]{width:100%}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}th{color:#697586;text-transform:capitalize}.quality{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quality div{background:#fafbfd;border:1px solid #e8edf3;border-radius:10px;padding:10px;font-size:12px}.error{color:#b42318;margin-top:12px}@media(max-width:900px){.kpis,.grid3,#scenario,.quality{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:16px}.hdr{display:block}h1{font-size:27px}.kpis,.grid3,#scenario,.quality{grid-template-columns:1fr}}</style></head><body><main><header class="hdr"><div><div class="ey">BUSINESS ANALYTICS • DECISION SUPPORT</div><h1 id="title">Dashboard</h1><p id="question" class="sub"></p></div><div class="actions"><button id="export">Export Filtered CSV</button><button id="reset">Reset</button></div></header><div class="note"><b>Data governance:</b> synthetic/illustrative portfolio data. KPI logic, prioritisation and scenario assumptions are documented separately.</div><section id="filters" class="filters"></section><section id="kpis" class="kpis"></section><section class="grid3"><div class="card"><h3>Performance view</h3><div class="chart"><canvas id="mainChart"></canvas></div></div><div class="card"><h3>Priority ranking</h3><div class="chart"><canvas id="rankChart"></canvas></div></div><div class="card"><h3>Business mix</h3><div class="chart"><canvas id="mixChart"></canvas></div></div></section><section class="card wide"><h3>Decision table</h3><div style="overflow:auto"><table><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div></section><section class="card wide"><h3>Scenario simulator</h3><div id="scenario"></div><p id="scenarioText" class="note"></p></section><section class="card wide"><h3>Data quality & governance</h3><div id="quality" class="quality"></div></section><div id="error" class="error"></div></main><script src="https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js"></script></body></html>
