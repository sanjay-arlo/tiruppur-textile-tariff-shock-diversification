name: Build and deploy industry dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate or verify project dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('sample_tiruppur_export_orders.csv')
          if not p.exists():
              h=['month','market','product_category','us_tariff_pct','order_value_inr','order_units_index','export_margin_pct']; rows=[]
              months=[f'2025-{m:02d}' for m in range(1,13)]+[f'2026-{m:02d}' for m in range(1,7)]; mk=['US','EU','UK','Middle East','Other']; pc=['Knitwear','Sportswear','Innerwear','Kidswear','Home Textiles']
              for i in range(150):
                  m=months[i%18]; market=mk[i%5]; prod=pc[i%5]; tariff=8 if market!='US' else 18+(i*3)%25; value=450000+(i*7919)%1750000; margin=round(8+(i*7)%13-(max(0,tariff-18)*.18 if market=='US' else 0),1); rows.append([m,market,prod,tariff,value,70+(i*17)%70,margin])
              with p.open('w',newline='',encoding='utf-8') as f: w=csv.writer(f); w.writerow(h); w.writerows(rows)
          PY
      - name: Build dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/index.html -o dashboard/index.html
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js -o dashboard/app.js
          cp sample_tiruppur_export_orders.csv dashboard/data.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard sample_tiruppur_export_orders.csv
          if ! git diff --cached --quiet; then git commit -m 'feat: build industry dashboard and dataset [skip ci]'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
